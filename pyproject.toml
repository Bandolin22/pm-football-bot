[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-football-bot"
version = "0.1.0"
description = "YAML-driven Polymarket harvest bot for EPL, LaLiga, and UCL"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.32",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
live = ["py-clob-client-v2>=1.1"]
dev = ["pytest>=8.0"]
ui = ["streamlit>=1.40"]
explain = ["anthropic>=0.40"]

[project.scripts]
pm-football-bot = "pm_football_bot.scan:main"
pm-predict-train = "pm_football_bot.predict.train:main"
pm-watch-alert = "pm_football_bot.notify:main"
pm-watch-runtime = "pm_football_bot.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
